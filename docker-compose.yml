# Local development stack: Postgres + the Go backend.
# The frontend runs separately with `npm run dev` (see frontend/README section).
#
#   docker compose up --build
#
# The backend applies migrations automatically on startup.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: saige
      POSTGRES_PASSWORD: saige
      POSTGRES_DB: saige
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saige -d saige"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://saige:saige@db:5432/saige?sslmode=disable
      ALLOWED_ORIGIN: http://localhost:5173
      PORT: "8080"
      IP_HASH_SALT: local-dev-salt-not-for-production
    ports:
      - "8080:8080"

volumes:
  pgdata:
