# Optional Render Blueprint. You can either import this file (Render → New →
# Blueprint) or configure the service manually per DEPLOYMENT.md.
#
# Secrets (DATABASE_URL, IP_HASH_SALT) are intentionally NOT stored here; set
# them in the Render dashboard.
services:
  - type: web
    name: saige-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set manually (Neon connection string)
      - key: IP_HASH_SALT
        sync: false # set manually (openssl rand -hex 32)
      - key: ALLOWED_ORIGIN
        sync: false # set to your Cloudflare Pages URL, e.g. https://your-project.pages.dev
      # PORT is provided by Render automatically.
